services:
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    container_name: whatsapp
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - whatsapp:/app/storages
  
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    env_file:
      - .env
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  whatsapp:
  n8n_data: